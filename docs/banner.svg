<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Ajay Kumar, AI/ML engineer. A cinematic noir portfolio.">
  <defs>
    <radialGradient id="glow" cx="78%" cy="30%" r="60%">
      <stop offset="0" stop-color="#f5b41f" stop-opacity=".30"/>
      <stop offset=".35" stop-color="#f5b41f" stop-opacity=".10"/>
      <stop offset="1" stop-color="#f5b41f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#c88a10"/>
      <stop offset=".55" stop-color="#f5b41f"/>
      <stop offset="1" stop-color="#ffd978"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070605" stop-opacity="0"/>
      <stop offset="1" stop-color="#070605"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="360" fill="#070605"/>
  <rect width="1280" height="360" fill="url(#glow)"/>
  <!-- the eye: orbit rings and a few synapse points -->
  <g fill="none" stroke="#f5b41f" stroke-opacity=".42" stroke-width="1.1">
    <circle cx="1020" cy="120" r="74"/>
    <ellipse cx="1020" cy="120" rx="150" ry="52" transform="rotate(-24 1020 120)" stroke-opacity=".28"/>
    <ellipse cx="1020" cy="120" rx="118" ry="38" transform="rotate(38 1020 120)" stroke-opacity=".22"/>
  </g>
  <g fill="#f5b41f">
    <circle cx="1020" cy="120" r="9" fill-opacity=".95"/>
    <circle cx="1020" cy="120" r="30" fill-opacity=".10"/>
    <circle cx="975" cy="86" r="2.4"/><circle cx="1068" cy="94" r="2"/><circle cx="1049" cy="160" r="2.6"/>
    <circle cx="990" cy="152" r="1.8"/><circle cx="1094" cy="132" r="1.6"/><circle cx="1148" cy="64" r="3"/>
  </g>
  <g fill="none" stroke="#f5b41f" stroke-opacity=".30" stroke-width=".8">
    <path d="M975 86 L1020 120 L1068 94 M1020 120 L1049 160 M1020 120 L990 152 M1068 94 L1094 132 L1049 160"/>
  </g>
  <!-- film-strip hairlines -->
  <g stroke="#f5b41f" stroke-opacity=".18">
    <line x1="64" y1="52" x2="1216" y2="52"/><line x1="64" y1="308" x2="1216" y2="308"/>
  </g>
  <g fill="#f5b41f" fill-opacity=".16">
    <rect x="64" y="40" width="14" height="8" rx="1"/><rect x="104" y="40" width="14" height="8" rx="1"/><rect x="144" y="40" width="14" height="8" rx="1"/>
    <rect x="64" y="312" width="14" height="8" rx="1"/><rect x="104" y="312" width="14" height="8" rx="1"/><rect x="144" y="312" width="14" height="8" rx="1"/>
  </g>
  <text x="64" y="86" font-family="'JetBrains Mono','SF Mono',Consolas,monospace" font-size="14" letter-spacing="4.2" fill="#f5b41f" fill-opacity=".85">AI / ML ENGINEER  ·  NLP &amp; LLM RESEARCH</text>
  <text x="62" y="196" font-family="Fraunces,'Playfair Display',Georgia,'Times New Roman',serif" font-size="108" font-weight="300" letter-spacing="-4" fill="#efe7d6">Ajay <tspan font-style="italic" fill="url(#gold)">Kumar</tspan></text>
  <text x="66" y="250" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" fill="#a89f8c">A cinematic, scroll-driven portfolio. Built from scratch, no framework.</text>
  <text x="66" y="338" font-family="'JetBrains Mono','SF Mono',Consolas,monospace" font-size="12" letter-spacing="3" fill="#8a8170">CHENNAI  ·  TAIWAN  ·  PORTFOLIO 2026</text>
</svg>
